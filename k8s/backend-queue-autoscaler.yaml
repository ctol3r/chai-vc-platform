apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend-queue-scaler
spec:
  scaleTargetRef:
    name: backend
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: queue_depth
        query: queue_depth
        threshold: '100'
