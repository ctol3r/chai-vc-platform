global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'vitalcv-dev'
    environment: 'development'

# Alert manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules
rule_files:
  - "slo_alerts.yml"
  # - "first.rules"
  # - "second.rules"

# Scrape configurations
scrape_configs:
  # VitalCV Backend
  - job_name: 'vitalcv-backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis Exporter (if using)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Postgres Exporter (if using)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
