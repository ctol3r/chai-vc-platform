version: '3.8'

services:
  substrate-node:
    build:
      context: ./substrate
      dockerfile: Dockerfile
    ports:
      - "9944:9944"
      - "9933:9933"
    environment:
      - RUST_LOG=info
    command: >
      --dev
      --ws-external
      --rpc-external
      --rpc-cors=all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9933/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - chai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=staging
      - SUBSTRATE_WS_URL=ws://substrate-node:9944
      - ACA_PY_URL=http://aca-py:8021
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chai_platform
    depends_on:
      substrate-node:
        condition: service_healthy
      postgres:
        condition: service_healthy
      aca-py:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - chai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_SUBSTRATE_WS_URL=ws://substrate-node:9944
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - chai-network

  aca-py:
    image: bcgovimages/aries-cloudagent:py36-1.16-1
    ports:
      - "8020:8020"
      - "8021:8021"
    environment:
      - ACAPY_ENDPOINT=http://aca-py:8020
      - ACAPY_ADMIN_ENDPOINT=http://aca-py:8021
      - ACAPY_WEBHOOK_URL=http://backend:4000/webhooks/aca-py
      - ACAPY_WALLET_TYPE=indy
      - ACAPY_WALLET_NAME=chai-platform-wallet
      - ACAPY_WALLET_KEY=secure-wallet-key-123
      - ACAPY_AUTO_PROVISION=true
      - ACAPY_LOG_LEVEL=info
    command: >
      start
      --inbound-transport http 0.0.0.0 8020
      --outbound-transport http
      --admin 0.0.0.0 8021
      --admin-insecure-mode
      --auto-provision
      --wallet-type indy
      --wallet-name chai-platform-wallet
      --wallet-key secure-wallet-key-123
      --seed 000000000000000000000000Trustee1
      --label "CHAI Platform Agent"
      --auto-accept-invites
      --auto-accept-requests
      --auto-store-credential
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - chai-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=chai_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chai_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chai-network

volumes:
  postgres_data:

networks:
  chai-network:
    driver: bridge
