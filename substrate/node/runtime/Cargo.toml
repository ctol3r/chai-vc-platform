[package]
name = "node-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
sp-core = { version = "10.0.0", default-features = false }
sp-runtime = { version = "10.0.0", default-features = false }
sp-version = { version = "10.0.0", default-features = false }
frame-support = { version = "8.0.0", default-features = false }
frame-system = { version = "8.0.0", default-features = false }
pallet-did = { path = "../../pallets/did", default-features = false }
pallet-credential = { path = "../../pallets/credential", default-features = false }

[features]
default = ["std"]
std = [
  "sp-core/std",
  "sp-runtime/std",
  "sp-version/std",
  "frame-support/std",
  "frame-system/std",
  "pallet-did/std",
  "pallet-credential/std"
]
