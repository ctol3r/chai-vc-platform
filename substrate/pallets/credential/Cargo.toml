[package]
name = "pallet-credential"
version = "0.1.0"
edition = "2021"
[dependencies]
frame-support = { version = "8.0.0", default-features = false }
frame-system  = { version = "8.0.0", default-features = false }
sp-runtime    = { version = "10.0.0", default-features = false }
sp-io         = { version = "10.0.0", default-features = false }
sp-core       = { version = "10.0.0", default-features = false }
sp-std        = { version = "6.0.0", default-features = false }
scale-info    = { version = "2", default-features = false, features = ["derive"] }
parity-scale-codec = { version = "3", default-features = false, features = ["derive"] }

[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "sp-runtime/std",
    "sp-io/std",
    "sp-core/std",
    "sp-std/std",
    "scale-info/std",
    "parity-scale-codec/std",
]

[dev-dependencies]
frame-support = { version = "8.0.0" }
frame-system  = { version = "8.0.0" }
sp-runtime    = { version = "10.0.0" }
sp-io         = { version = "10.0.0" }
sp-core       = { version = "10.0.0" }
sp-std        = { version = "6.0.0" }
