name: PR CI
on:
  pull_request:
    branches:
      - '**'

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps
        # TODO: remove --legacy-peer-deps once ethers/hardhat versions are aligned
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Build
        working-directory: backend
        run: npm run build --if-present
      - name: Test
        working-directory: backend
        env:
          CI: true
        run: npm test -- --runInBand

  frontend:
    name: Frontend (lint & build)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
        # TODO: remove --legacy-peer-deps once ethers/hardhat versions are aligned
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies (no scripts)
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps
        # TODO: remove legacy peer flag when dependency versions align
      - name: npm audit (production + high severity)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit aca_py_agent
        run: pip-audit -r aca_py_agent/requirements.txt
