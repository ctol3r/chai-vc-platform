name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
      docs: ${{ steps.filter.outputs.docs }}
      e2e: ${{ steps.filter.outputs.e2e }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            ai:
              - 'ai-matcher-service/**'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'marketing/**'
            e2e:
              - 'docker-compose*.yml'
              - 'compose*.yml'
              - 'e2e/**'
              - 'backend/**'
              - 'ai-matcher-service/**'
            rust:
              - 'pallets/**'
              - 'substrate/**'
              - 'identity-governance-pallet/**'

  python-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        service: ['ai-matcher-service','backend']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python-version }} }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles(format('{0}/requirements*.txt', matrix.service)) }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install deps & pytest (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip
          if [ -f requirements.lock.txt ]; then pip install -r requirements.lock.txt; \
          elif [ -f requirements.txt ]; then pip install -r requirements.txt; \
          else python -m pip install pytest pytest-cov; fi
          pytest --cov=src --cov-report=xml --cov-fail-under=80 -q

  typescript-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    strategy: { matrix: { node-version: ['20','22'] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Build
        working-directory: backend
        run: npm run build --if-present
      - name: Test
        working-directory: backend
        run: npm test -- --coverage --coverageReporters=text --coverageThreshold='{ "global": { "lines": 80 }}'

  rust-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Cargo tests
        run: |
          for dir in pallets/credential-registry pallets/proof-of-existence identity-governance-pallet substrate/pallet-state-board substrate/pallets/credential; do
            if [ -f "$dir/Cargo.toml" ]; then
              (cd $dir && cargo test --locked);
            fi;
          done

  integration-tests:
    needs: [detect-changes, python-tests, typescript-tests]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make
      - name: Full suite
        run: make test