name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python deps
        run: |
          pip install -r ai-matcher-service/requirements.txt || true
      - name: Run ai-matcher-service tests
        run: |
          cd ai-matcher-service && pytest || true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend deps
        run: |
          if [ -f backend/package.json ]; then cd backend && npm ci; fi
      - name: Run backend tests
        run: |
          if [ -f backend/package.json ]; then cd backend && npm test; fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ai matcher image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-matcher-service
          tags: ghcr.io/${{ github.repository }}/ai-matcher:${{ github.sha }}
          push: true
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          push: true
